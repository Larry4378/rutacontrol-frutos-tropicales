name: Generar APK FTP - ODOMETRO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'mango.css'
      - 'styles.css'
      - 'capacitor.config.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK instalable
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Compilar la aplicación
        run: pnpm run build

      - name: Preparar Java para Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Preparar Android
        uses: android-actions/setup-android@v3

      - name: Configurar ruta de Android
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Instalar componentes de Android
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Actualizar el proyecto Android
        run: node node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Generar APK
        working-directory: android
        run: bash ./gradlew :app:assembleDebug --no-daemon

      - name: Guardar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: FTP-ODOMETRO-APK-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
