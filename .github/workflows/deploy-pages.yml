name: Publicar RutaControl en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preparar Java para Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias
        run: npm install
      - name: Ejecutar pruebas
        run: npm test
      - name: Compilar aplicación web
        run: npm run build
      - name: Sincronizar aplicación Android
        run: npx cap sync android
      - name: Compilar APK Android
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Subir APK Android
        uses: actions/upload-artifact@v4
        with:
          name: RutaControl-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Subir página
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
